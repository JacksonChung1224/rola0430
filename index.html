<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>終極人生使用說明書</title>
    
    <!-- 引入 Tailwind CSS (版面樣式) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- 引入 Babel -->
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

    <!-- 引入 Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* 隱藏列印時不必要的元素 */
        @media print {
            body { background-color: white !important; }
            .print\:hidden { display: none !important; }
            .print\:shadow-none { box-shadow: none !important; }
            .print\:border-none { border: none !important; }
            .print\:p-0 { padding: 0 !important; }
            .print\:m-0 { margin: 0 !important; }
            .print\:max-w-full { max-width: 100% !important; }
            .print\:block { display: block !important; }
            .print\:h-auto { height: auto !important; }
            .print\:overflow-visible { overflow: visible !important; }
        }
    </style>
</head>
<body>
    <div id="root">
        <div style="text-align: center; margin-top: 20vh; font-family: sans-serif; color: #64748b;">
            <i class="fas fa-spinner fa-spin fa-2x mb-4"></i>
            <p>系統載入中，請稍候...</p>
        </div>
    </div>

    <script type="text/babel" data-presets="react">
        const { useState, useEffect, useRef, useCallback } = React;

        const QUESTIONS = {
          values: [
            { id: 'v1', label: '1. 你有尊敬的人嗎？他是誰？為什麼尊敬他？喜歡他什麼地方？', placeholder: '例如：我尊敬...因為他把人生角色扮演得很好...' },
            { id: 'v2', label: '2. 你人生中最活躍的時期是什麼時候？影響你很大的事情是什麼？你發生了什麼改變？', placeholder: '例如：大二時...讓我意識到...' },
            { id: 'v3', label: '3. 你覺得現在這個社會有什麼不足的地方？有什麼需要改善的地方？', placeholder: '例如：我覺得社會充滿對立，可以多一點包容...' },
            { id: 'v4', label: '4. 在你朋友眼裡，你是一個在乎什麼東西的人？', placeholder: '例如：在朋友眼裡，我很在乎自己開不開心...' },
            { id: 'v5', label: '5. 你不希望你的朋友給你什麼樣的建議？', placeholder: '例如：我不希望朋友套用他們的價值觀在我身上...' }
          ],
          talents: [
            { id: 't1', label: '1. 目前你人生中最充實跟順利的時期是什麼時候？那段時間你在做什麼？', placeholder: '例如：在某公司實習的時候...' },
            { id: 't2', label: '2. 最近一次你覺得不耐煩的事情是什麼？（對「別人」不耐煩）', placeholder: '例如：我容易對講話慢、沒重點的人不耐煩...' },
            { id: 't3', label: '3. 問身邊的人自己擅長什麼？', placeholder: '例如：具有美感、擅長規劃、邏輯好...' },
            { id: 't4', label: '4. 放棄現在的工作，你特別想做的事情是什麼？', placeholder: '例如：想去學習健身、語言、或者去旅行...' },
            { id: 't5', label: '5. 到目前為止，你做成功的事情是什麼？', placeholder: '例如：成功帶領過一個團隊、考上研究所...' }
          ],
          dreams: [
            { id: 'd1', label: '1. 有什麼事情就算花錢，你也願意去了解、去學習？', placeholder: '例如：我願意花錢在自我成長、上課、運動指導...' },
            { id: 'd2', label: '2. 你的書架上有什麼內容的書？', placeholder: '例如：心理勵志、行銷管理、語言學習...' },
            { id: 'd3', label: '3. 有沒有什麼內容，給你很大的幫助？', placeholder: '例如：《做自己的生命設計師》這本書啟發了我...' },
            { id: 'd4', label: '4. 你有特別想要感謝的人和事嗎？為什麼想特別感謝他？', placeholder: '例如：感謝媽媽的支持，感謝前老闆的帶領...' },
            { id: 'd5', label: '5. 你對這個世界有什麼不滿和憤怒的嗎？或者你希望這個世界是什麼樣子？', placeholder: '例如：希望世界不要有霸凌和歧視，大家專注於自己...' }
          ]
        };

        const PROMPT_TEMPLATES = {
          aiValues: (answers) => `你現在是一名生涯教練，你要針對以下我提出的五個價值觀，統整並梳理成一個核心價值觀，並告訴我，我的一個核心價值觀是什麼？(請用繁體中文回覆我)\n\n第一個價值觀：${answers.v1 || ''}\n\n第二個價值觀：${answers.v2 || ''}\n\n第三個價值觀：${answers.v3 || ''}\n\n第四個價值觀：${answers.v4 || ''}\n\n第五個價值觀：${answers.v5 || ''}`,
          
          aiManual: (answers) => `你現在是一名蓋洛普優勢認證教練，你要針對以下我提出的五個自我觀察與優勢，統整並梳理成一個我的使用說明書，並告訴我，在我的使用說明書裡，我最擅長做什麼？(請用繁體中文回答我)\n\n個人使用說明書架構如下，包含四個段落含結語：\n一、核心優勢(我的三大核心優勢)\n二、發展機遇\n三、最擅長的事情\n結語\n\n五個自我觀察與優勢如下：\n\n第一個自我觀察與優勢：${answers.t1 || ''}\n\n第二個自我觀察與優勢：${answers.t2 || ''}\n\n第三個自我觀察與優勢：${answers.t3 || ''}\n\n第四個自我觀察與優勢：${answers.t4 || ''}\n\n第五個自我觀察與優勢：${answers.t5 || ''}`,
          
          aiJobs: (results) => `你現在是一名蓋洛普優勢認證教練兼職涯教練，你要針對以下我提供的個人使用說明書(天賦與才能)，統整並總結出適合我發展的職業，並且明確告訴我：在不違背我的價值觀為前提下，你會建議我從事哪10種職業與職位，更容易取得成功？(請用繁體中文回答我)\n\n【天賦與才能】\n${results.aiManual || '(請先完成前面的步驟)'}\n\n【價值觀】\n${results.aiValues || '(請先完成前面的步驟)'}`,
          
          aiDreams: (answers) => `你現在是一名人生教練，你要針對以下我提出的五個自我觀察與夢想，統整並總結出3個關鍵詞，並引導出我內心真心渴望的夢想，並且明確告訴我：如果有一天，我不需要考量金錢，我做什麼事或工作會讓我感到人生充滿熱情？(請用繁體中文回答我)\n\n第一個自我觀察與夢想：${answers.d1 || ''}\n\n第二個自我觀察與夢想：${answers.d2 || ''}\n\n第三個自我觀察與夢想：${answers.d3 || ''}\n\n第四個自我觀察與夢想：${answers.d4 || ''}\n\n第五個自我觀察與夢想：${answers.d5 || ''}`,
          
          aiBusiness: (results) => `你現在是一名商業教練，你要針對以下我提供的價值觀、個人使用說明書(天賦與才能)、夢想，統整並總結出適合我發展的事業，並且明確告訴我：以整個生涯作為跨度，你會建議我發展哪三種事業，更容易成功？(請用繁體中文回答我)\n\n【價值觀】\n${results.aiValues || '(請先完成前面的步驟)'}\n\n【天賦與才能】\n${results.aiManual || '(請先完成前面的步驟)'}\n\n【夢想】\n${results.aiDreams || '(請先完成前面的步驟)'}`
        };

        const STEPS = [
          { id: 0, title: '開始說明', icon: 'fas fa-book-open' },
          { id: 1, title: 'Q1-5: 價值觀', icon: 'fas fa-handshake-angle' },
          { id: 2, title: 'Q6-10: 天賦才能', icon: 'fas fa-wand-magic-sparkles' },
          { id: 3, title: 'Q11-15: 夢想', icon: 'fas fa-bullseye' },
          { id: 4, title: 'AI 分析: 核心價值', icon: 'fas fa-message' },
          { id: 5, title: 'AI 分析: 使用說明書', icon: 'fas fa-message' },
          { id: 6, title: 'AI 分析: 職業建議', icon: 'fas fa-briefcase' },
          { id: 7, title: 'AI 分析: 可能志業', icon: 'fas fa-bullseye' },
          { id: 8, title: 'AI 分析: 事業建議', icon: 'fas fa-bullseye' },
          { id: 9, title: '最終報告', icon: 'fas fa-check-circle' }
        ];

        // Custom hook for debouncing
        function useDebounce(value, delay) {
          const [debouncedValue, setDebouncedValue] = useState(value);
          useEffect(() => {
            const handler = setTimeout(() => {
              setDebouncedValue(value);
            }, delay);
            return () => {
              clearTimeout(handler);
            };
          }, [value, delay]);
          return debouncedValue;
        }

        function App() {
          const [supabaseClient, setSupabaseClient] = useState(null);
          const [user, setUser] = useState(null);
          const [dataLoaded, setDataLoaded] = useState(false);

          const [answers, setAnswers] = useState({});
          const [gptResults, setGptResults] = useState({ aiValues: '', aiManual: '', aiJobs: '', aiDreams: '', aiBusiness: '' });
          const [currentStep, setCurrentStep] = useState(0);

          const debouncedAnswers = useDebounce(answers, 1000);
          const debouncedGptResults = useDebounce(gptResults, 1000);
          const debouncedStep = useDebounce(currentStep, 1000);

          const [copiedStates, setCopiedStates] = useState({});
          const [showResetModal, setShowResetModal] = useState(false);
          const [showSaveToast, setShowSaveToast] = useState(false);
          
          const [isGeneratingAI, setIsGeneratingAI] = useState({});
          const [apiError, setApiError] = useState('');

          // 1. 初始化 Supabase 客戶端
          useEffect(() => {
            const initSupabase = async () => {
              try {
                const res = await fetch('/api/config');
                if (res.ok) {
                  const config = await res.json();
                  if (config.supabaseUrl && config.supabaseAnonKey) {
                    const client = supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
                    setSupabaseClient(client);
                  }
                }
              } catch (e) {
                console.error("Failed to load Supabase config:", e);
              }
            };
            initSupabase();
          }, []);

          // 2. 監聽登入狀態
          useEffect(() => {
            if (!supabaseClient) return;
            
            // 取得當前 session
            supabaseClient.auth.getSession().then(({ data: { session } }) => {
              setUser(session?.user || null);
            });

            // 監聽變化
            const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((_event, session) => {
              setUser(session?.user || null);
              if (!session?.user) {
                // 登出時清空資料
                setAnswers({});
                setGptResults({ aiValues: '', aiManual: '', aiJobs: '', aiDreams: '', aiBusiness: '' });
                setCurrentStep(0);
                setDataLoaded(false);
              }
            });

            return () => subscription.unsubscribe();
          }, [supabaseClient]);

          // 3. 載入雲端資料
          useEffect(() => {
            const loadData = async () => {
              if (user && supabaseClient && !dataLoaded) {
                try {
                  const { data, error } = await supabaseClient
                    .from('user_progress')
                    .select('*')
                    .eq('user_id', user.id)
                    .single();
                  
                  if (data) {
                    if (data.answers) setAnswers(data.answers);
                    if (data.gpt_results) setGptResults(data.gpt_results);
                    if (data.current_step !== undefined) setCurrentStep(data.current_step);
                  }
                  setDataLoaded(true);
                } catch (e) {
                  console.error("載入資料失敗", e);
                  setDataLoaded(true); // 即使失敗也設為 true 避免無限迴圈
                }
              }
            };
            loadData();
          }, [user, supabaseClient, dataLoaded]);

          // 4. 自動儲存至雲端
          useEffect(() => {
            const saveData = async () => {
              if (user && supabaseClient && dataLoaded) {
                try {
                  const { error } = await supabaseClient
                    .from('user_progress')
                    .upsert({
                      user_id: user.id,
                      answers: debouncedAnswers,
                      gpt_results: debouncedGptResults,
                      current_step: debouncedStep,
                      updated_at: new Date().toISOString()
                    }, { onConflict: 'user_id' });
                  
                  if (!error) {
                    setShowSaveToast(true);
                    setTimeout(() => setShowSaveToast(false), 2000);
                  }
                } catch (e) {
                  console.warn("Supabase 儲存失敗", e);
                }
              }
            };
            
            // 只有當資料不為空時才儲存，避免一登入就被空資料蓋過
            if (Object.keys(debouncedAnswers).length > 0 || debouncedStep > 0) {
              saveData();
            }
          }, [debouncedAnswers, debouncedGptResults, debouncedStep, user, supabaseClient, dataLoaded]);

          const handleLogin = async () => {
            if (!supabaseClient) return;
            await supabaseClient.auth.signInWithOAuth({
              provider: 'google',
              options: { redirectTo: window.location.origin }
            });
          };

          const handleLogout = async () => {
            if (!supabaseClient) return;
            await supabaseClient.auth.signOut();
          };

          const handleAnswerChange = (id, value) => {
            setAnswers(prev => ({ ...prev, [id]: value }));
          };

          const handleResultChange = (stepId, value) => {
            setGptResults(prev => ({ ...prev, [stepId]: value }));
          };

          const confirmReset = async () => {
            setAnswers({});
            setGptResults({ aiValues: '', aiManual: '', aiJobs: '', aiDreams: '', aiBusiness: '' });
            setCurrentStep(0);
            
            if (user && supabaseClient) {
              await supabaseClient
                .from('user_progress')
                .upsert({
                  user_id: user.id,
                  answers: {},
                  gpt_results: { aiValues: '', aiManual: '', aiJobs: '', aiDreams: '', aiBusiness: '' },
                  current_step: 0,
                  updated_at: new Date().toISOString()
                }, { onConflict: 'user_id' });
            }
            setShowResetModal(false);
          };

          const copyToClipboard = async (text, id) => {
            try {
              const textArea = document.createElement("textarea");
              textArea.value = text;
              document.body.appendChild(textArea);
              textArea.select();
              document.execCommand("copy");
              document.body.removeChild(textArea);
              
              setCopiedStates({ ...copiedStates, [id]: true });
              setTimeout(() => {
                setCopiedStates({ ...copiedStates, [id]: false });
              }, 2000);
            } catch (err) {
              console.error('Failed to copy text: ', err);
            }
          };

          const nextStep = () => setCurrentStep(prev => Math.min(prev + 1, STEPS.length - 1));
          const prevStep = () => setCurrentStep(prev => Math.max(prev - 1, 0));

          const downloadWord = () => {
            const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>人生使用說明書</title></head><body>";
            const footer = "</body></html>";
            const content = `
              <div style="font-family: sans-serif; max-width: 800px; margin: 0 auto;">
                <h1 style="text-align: center; color: #065f46; border-bottom: 2px solid #a7f3d0; padding-bottom: 10px;">《終極人生使用說明書》</h1>
                <h2 style="color: #047857; margin-top: 20px;">一、核心價值觀</h2>
                <p style="white-space: pre-wrap; line-height: 1.6;">${gptResults.aiValues || '尚未填寫'}</p>
                <h2 style="color: #1d4ed8; margin-top: 20px;">二、個人使用說明書</h2>
                <p style="white-space: pre-wrap; line-height: 1.6;">${gptResults.aiManual || '尚未填寫'}</p>
                <h2 style="color: #7e22ce; margin-top: 20px;">三、適合的 10 種職業建議</h2>
                <p style="white-space: pre-wrap; line-height: 1.6;">${gptResults.aiJobs || '尚未填寫'}</p>
                <h2 style="color: #b45309; margin-top: 20px;">四、你的可能志業</h2>
                <p style="white-space: pre-wrap; line-height: 1.6;">${gptResults.aiDreams || '尚未填寫'}</p>
                <h2 style="color: #be123c; margin-top: 20px;">五、相對容易成功的 3 種事業</h2>
                <p style="white-space: pre-wrap; line-height: 1.6;">${gptResults.aiBusiness || '尚未填寫'}</p>
              </div>
            `;
            const sourceHTML = header + content + footer;
            const blob = new Blob(['\ufeff', sourceHTML], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = '終極人生使用說明書.doc';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          };

          const downloadPDF = () => {
            window.print();
          };

          // 呼叫 Edge Function 進行 AI 生成
          const generateAI = async (prompt, gptResultKey) => {
            if (!user) {
              alert('請先登入 Google 帳號，以確保您的生成結果能夠儲存！');
              return;
            }

            setIsGeneratingAI({ ...isGeneratingAI, [gptResultKey]: true });
            setApiError('');
            // 清空當前欄位，準備填入新內容
            setGptResults(prev => ({ ...prev, [gptResultKey]: '' }));

            try {
              const response = await fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt })
              });

              if (!response.ok) {
                throw new Error(`系統發生錯誤 (${response.status})，請稍後再試。`);
              }

              const reader = response.body.getReader();
              const decoder = new TextDecoder("utf-8");
              let done = false;

              while (!done) {
                const { value, done: readerDone } = await reader.read();
                done = readerDone;
                if (value) {
                  const chunk = decoder.decode(value, { stream: true });
                  
                  // 解析 SSE (Server-Sent Events)
                  const lines = chunk.split('\n');
                  for (const line of lines) {
                    if (line.startsWith('data: ')) {
                      const dataStr = line.slice(6);
                      if (dataStr === '[DONE]') {
                        done = true;
                        break;
                      }
                      try {
                        const data = JSON.parse(dataStr);
                        if (data.type === 'content_block_delta' && data.delta && data.delta.text) {
                          setGptResults(prev => ({ 
                            ...prev, 
                            [gptResultKey]: prev[gptResultKey] + data.delta.text 
                          }));
                        }
                      } catch (e) {
                        // ignore parse errors for partial chunks
                      }
                    }
                  }
                }
              }
            } catch (err) {
              console.error("AI Generation error:", err);
              setApiError(err.message || '連線逾時或伺服器錯誤，請檢查網路狀態或重新整理。');
            } finally {
              setIsGeneratingAI({ ...isGeneratingAI, [gptResultKey]: false });
            }
          };

          const renderIntro = () => (
            <div className="flex flex-col items-center justify-center text-center space-y-8 py-12 animate-in fade-in zoom-in duration-500">
              <div className="bg-emerald-100 p-6 rounded-full text-emerald-600 mb-4 shadow-sm relative">
                <i className="fas fa-book-open text-6xl"></i>
              </div>
              <h1 className="text-4xl font-bold text-slate-800 tracking-tight">終極人生使用說明書</h1>
              <p className="text-lg text-slate-600 max-w-2xl leading-relaxed">
                這是一個引導式的自我探索工具。我們將透過 15 個深度問題，結合 AI 分析能力，為您梳理出個人的核心價值觀、天賦才能、職業建議與未來事業方向。所有進度將自動儲存於您的雲端帳號中。
              </p>
              
              {!user ? (
                <div className="bg-amber-50 text-amber-700 px-6 py-4 rounded-xl border border-amber-200 flex flex-col items-center max-w-xl w-full">
                  <i className="fas fa-cloud-upload-alt text-2xl mb-2"></i> 
                  <p className="mb-3 font-medium">請登入 Google 以儲存您的進度</p>
                  <button onClick={handleLogin} className="bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 font-bold py-2 px-6 rounded-lg shadow-sm flex items-center transition-colors">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" className="w-5 h-5 mr-2" />
                    使用 Google 登入
                  </button>
                </div>
              ) : (
                Object.keys(answers).length > 0 && (
                  <div className="bg-emerald-50 text-emerald-700 px-4 py-3 rounded-xl border border-emerald-200 text-sm flex items-center">
                    <i className="fas fa-cloud-check mr-2"></i> 系統已從雲端載入您的進度，您可以隨時接續填寫。
                  </div>
                )
              )}
